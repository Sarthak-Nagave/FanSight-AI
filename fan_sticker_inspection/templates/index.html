<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Sticker Inspection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-title">FAN STICKER INSPECTION</div>
        <div class="header-status" id="app-status">READY</div>
    </header>

    <!-- MAIN TWO-PANEL LAYOUT -->
    <main class="main-layout">

        <!-- LEFT: Inspection Image -->
        <section class="panel-image">
            <div class="viewport-wrapper">
                <canvas id="viewport-canvas"></canvas>
                <video id="camera-stream" autoplay playsinline></video>
                <div class="viewport-placeholder" id="viewport-placeholder">
                    <p>Upload an image or use camera to begin inspection</p>
                </div>
            </div>
        </section>

        <!-- RIGHT: Result Panel -->
        <section class="panel-result" id="panel-result">

            <!-- Before inspection -->
            <div class="result-empty" id="result-empty">
                <p class="result-empty-text">Awaiting inspection</p>
            </div>

            <!-- After inspection -->
            <div class="result-content" id="result-content" style="display: none;">
                <div class="result-badge" id="result-badge">PASS</div>
                <div class="result-prediction" id="result-prediction">STICKER PRESENT</div>
                <div class="result-confidence-label">Confidence</div>
                <div class="result-confidence-value" id="result-confidence">96.4%</div>
                <div class="result-divider"></div>
                <div class="result-marker-info" id="result-marker-info"></div>
            </div>

        </section>

    </main>

    <!-- CONTROLS -->
    <footer class="controls">
        <div class="controls-left">
            <input type="file" id="file-input" accept="image/jpeg,image/png,image/jpg" style="display:none">
            <button class="btn btn-outline" id="btn-upload">Upload Image</button>
            <button class="btn btn-outline" id="btn-camera">Camera</button>
            <button class="btn btn-outline" id="btn-capture" style="display:none">Capture</button>
            <button class="btn btn-outline" id="btn-save" style="display:none">Save Image</button>
        </div>
        <div class="controls-right">
            <button class="btn btn-primary" id="btn-inspect" disabled>Inspect</button>
            <button class="btn btn-outline" id="btn-reset">New Inspection</button>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
